<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perfil · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="container">
  <div class="selector-jornada">
    <select id="selector-jugador"></select>
    <a href="#" id="btn-ver-pronosticos" class="btn-ver-todas">🗒️ Ver sus pronósticos</a>
  </div>

  <div id="tarjetas" class="latest-grid"></div>

  <details open>
    <summary><h2>Evolución de puntos</h2></summary>
    <div id="comparar-panel" style="margin-bottom:14px"></div>
    <div id="grafico"></div>
  </details>

  <details open>
    <summary><h2>Jornada a jornada</h2></summary>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Jornada</th><th>1X2</th><th>Exactos</th><th>Bonus</th>
            <th>G/P</th><th>Puntos</th><th>Acumulado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-jornadas"></tbody>
      </table>
    </div>
  </details>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "👤 Perfil de jugador",
  subtitulo: "Evolución, rachas y mejores jornadas",
  pagina: "participantes",
});

let CLAS = null;
const COMPARAR_COLORES = ["#60a5fa", "#f472b6", "#a78bfa", "#fb923c", "#22d3ee", "#facc15", "#34d399", "#c084fc"];
const comparadosSeleccionados = new Set();

function colorComparado(slug) {
  const idx = CLAS.clasificacion.findIndex((c) => c.slug === slug);
  return COMPARAR_COLORES[idx % COMPARAR_COLORES.length];
}

async function iniciar() {
  CLAS = await cargar("data/clasificacion.json", null);
  if (!CLAS || !CLAS.clasificacion.length) {
    document.getElementById("tarjetas").innerHTML =
      `<div class="vacio">Todavía no hay datos de ningún jugador.</div>`;
    return;
  }

  const selector = document.getElementById("selector-jugador");
  selector.innerHTML = CLAS.clasificacion
    .map((c) => `<option value="${c.slug}">${nombrePlano(c)}</option>`).join("");

  const pedido = new URLSearchParams(location.search).get("j");
  if (pedido && CLAS.clasificacion.some((c) => c.slug === pedido)) selector.value = pedido;

  selector.onchange = () => {
    comparadosSeleccionados.delete(selector.value); // no compararse consigo mismo
    history.replaceState(null, "", `?j=${selector.value}`);
    pintar(selector.value);
  };
  pintar(selector.value);
}

/* Acumulado jornada a jornada de un jugador a lo largo de TODAS las jornadas
   ya calculadas (no solo las suyas), para poder alinear su línea con la de
   otros jugadores en la misma gráfica aunque alguno se haya saltado alguna. */
function construirEvolucion(c, claves) {
  let acumulado = 0;
  return claves.map((k) => {
    const j = c.por_jornada[k];
    acumulado += j ? j.puntos : 0;
    return { clave: k, acumulado, jugada: !!j, ganador: j?.ganador, perdedor: j?.perdedor, puntos: j ? j.puntos : null };
  });
}

function pintar(slug) {
  const c = CLAS.clasificacion.find((x) => x.slug === slug);
  document.getElementById("btn-ver-pronosticos").href = `pronosticos_jugador.html?j=${slug}`;
  document.querySelector("header h1").textContent = `👤 ${nombrePlano(c)}`;
  const claves = ordenJornadas(CLAS.jornadas_calculadas.slice());
  const jugadas = claves.filter((k) => c.por_jornada[k]);

  // Acumulado y rachas
  let acumulado = 0;
  const serie = jugadas.map((k) => ({ clave: k, ...c.por_jornada[k], acumulado: (acumulado += c.por_jornada[k].puntos) }));

  const mejor = serie.reduce((a, b) => (b.puntos > a.puntos ? b : a), serie[0]);
  const peor = serie.reduce((a, b) => (b.puntos < a.puntos ? b : a), serie[0]);
  const rachaG = rachaMax(serie, (s) => s.ganador);
  const rachaP = rachaMax(serie, (s) => s.perdedor);
  const media = (c.puntos_totales / (c.jornadas_jugadas || 1)).toFixed(1);
  const pct = c.partidos_pronosticados
    ? Math.round((c.aciertos_1x2 / c.partidos_pronosticados) * 100) : 0;

  document.getElementById("tarjetas").innerHTML = [
    ["Posición", `${c.puesto}º`, `${c.puntos_totales} puntos`],
    ["Media por jornada", media, `${c.jornadas_jugadas} jornadas jugadas`],
    ["Acierto 1X2", `${pct} %`, `${c.aciertos_1x2} de ${c.partidos_pronosticados}`],
    ["Exactos", c.aciertos_exactos, `${c.bonus_rendimiento} pts de bonus`],
    ["Mejor jornada", mejor ? `${mejor.puntos} pts` : "—", mejor ? `Jornada ${parseInt(mejor.clave.slice(1))}` : ""],
    ["Peor jornada", peor ? `${peor.puntos} pts` : "—", peor ? `Jornada ${parseInt(peor.clave.slice(1))}` : ""],
    ["Jornadas ganadas", c.jornadas_ganadas, rachaG > 1 ? `Mejor racha: ${rachaG} seguidas` : "—"],
    ["Jornadas perdidas", c.jornadas_perdidas, rachaP > 1 ? `Peor racha: ${rachaP} seguidas` : "—"],
  ].map(([titulo, valor, pie]) => `
    <div class="match-card" style="padding:16px;text-align:center">
      <div class="match-header">${titulo}</div>
      <div class="match-score"><span>${valor}</span></div>
      <p class="nota" style="margin:6px 0 0">${pie}</p>
    </div>`).join("");

  pintarPanelComparar(slug);
  pintarGrafico(serie, c, slug);

  document.getElementById("cuerpo-jornadas").innerHTML = serie.map((s) => `
    <tr>
      <td><a href="pronosticos_jugador.html?j=${slug}&jornada=${s.clave}" class="mult-link">J${parseInt(s.clave.slice(1))}</a></td>
      <td>${s.aciertos_1x2}</td>
      <td class="pred-exact">${s.aciertos_exactos}</td>
      <td>${s.bonus || 0}</td>
      <td>${s.ganador ? '<span class="ganador-jornada">🏅</span>' : s.perdedor ? '<span class="perdedor-jornada">💀</span>' : "—"}</td>
      <td class="${s.ganador ? "ganador-jornada" : s.perdedor ? "perdedor-jornada" : ""}">${s.puntos}</td>
      <td class="pts-totales">${s.acumulado}</td>
    </tr>`).join("");
}

function pintarPanelComparar(slugPrincipal) {
  const otros = CLAS.clasificacion.filter((x) => x.slug !== slugPrincipal);
  const panel = document.getElementById("comparar-panel");
  if (!otros.length) { panel.innerHTML = ""; return; }

  panel.innerHTML = `
    <p class="nota" style="margin-bottom:6px">Comparar con:</p>
    <div style="display:flex;flex-wrap:wrap;gap:12px">
      ${otros.map((o) => `
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer;font-size:0.85em">
          <input type="checkbox" data-slug="${o.slug}" ${comparadosSeleccionados.has(o.slug) ? "checked" : ""}>
          <span style="width:10px;height:10px;border-radius:50%;background:${colorComparado(o.slug)};display:inline-block"></span>
          ${o.nombre}
        </label>`).join("")}
    </div>`;

  panel.querySelectorAll("input[type=checkbox]").forEach((cb) => {
    cb.onchange = () => {
      if (cb.checked) comparadosSeleccionados.add(cb.dataset.slug);
      else comparadosSeleccionados.delete(cb.dataset.slug);
      pintar(slugPrincipal);
    };
  });
}

function rachaMax(serie, test) {
  let max = 0, actual = 0;
  for (const s of serie) {
    actual = test(s) ? actual + 1 : 0;
    max = Math.max(max, actual);
  }
  return max;
}

function pintarGrafico(serie, cPrincipal, slugPrincipal) {
  if (!serie.length) { document.getElementById("grafico").innerHTML = ""; return; }

  const claves = ordenJornadas(CLAS.jornadas_calculadas.slice());
  const principal = construirEvolucion(cPrincipal, claves);
  const comparadas = [...comparadosSeleccionados].map((s) => ({
    slug: s,
    color: colorComparado(s),
    nombre: nombrePlano(CLAS.clasificacion.find((x) => x.slug === s)),
    serie: construirEvolucion(CLAS.clasificacion.find((x) => x.slug === s), claves),
  }));

  const W = 900, H = 260, M = { t: 20, r: 20, b: 30, l: 40 };
  const todosLosValores = [principal, ...comparadas.map((c) => c.serie)].flatMap((s) => s.map((p) => p.acumulado));
  const maxY = Math.max(...todosLosValores, 1);
  const minY = Math.min(...todosLosValores, 0);
  const rango = maxY - minY || 1;

  const x = (i) => M.l + (i * (W - M.l - M.r)) / Math.max(claves.length - 1, 1);
  const y = (v) => H - M.b - ((v - minY) / rango) * (H - M.t - M.b);

  // Solo la serie principal dibuja puntos (uno por jornada JUGADA de verdad,
  // no por cada jornada calculada) — para no llenar la gráfica de círculos
  // en las jornadas que ese jugador se saltó.
  const indicePorClave = Object.fromEntries(claves.map((k, i) => [k, i]));
  const puntosJugados = serie.map((s) => ({ ...s, i: indicePorClave[s.clave] }));

  const lineaPrincipal = principal.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.acumulado).toFixed(1)}`).join(" ");
  const areaPrincipal = `${lineaPrincipal} L${x(claves.length - 1).toFixed(1)},${H - M.b} L${x(0).toFixed(1)},${H - M.b} Z`;

  const lineasComparadas = comparadas.map((comp) => {
    const d = comp.serie.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.acumulado).toFixed(1)}`).join(" ");
    const ultimo = comp.serie[comp.serie.length - 1];
    return `
      <path d="${d}" fill="none" stroke="${comp.color}" stroke-width="2" stroke-dasharray="5,3" opacity="0.85"/>
      <circle cx="${x(comp.serie.length - 1).toFixed(1)}" cy="${y(ultimo.acumulado).toFixed(1)}" r="3.5" fill="${comp.color}"/>
      <text x="${(x(comp.serie.length - 1) + 6).toFixed(1)}" y="${(y(ultimo.acumulado) + 4).toFixed(1)}"
            fill="${comp.color}" font-size="10" font-weight="bold">${comp.nombre.slice(0, 10)}</text>`;
  }).join("");

  document.getElementById("grafico").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <line x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}" stroke="#444"/>
      <line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}" stroke="#444"/>
      <text x="8" y="${y(maxY) + 4}" fill="#9ca3af" font-size="11">${maxY}</text>
      <text x="8" y="${y(minY) + 4}" fill="#9ca3af" font-size="11">${minY}</text>
      <path d="${areaPrincipal}" fill="rgba(218,165,32,0.12)"/>
      <path d="${lineaPrincipal}" fill="none" stroke="goldenrod" stroke-width="2.5"/>
      ${puntosJugados.map((s) => `
        <circle cx="${x(s.i).toFixed(1)}" cy="${y(s.acumulado).toFixed(1)}" r="4"
                fill="${s.ganador ? "#4ade80" : s.perdedor ? "#ff4c4c" : "#1e1e1e"}"
                stroke="goldenrod" stroke-width="2">
          <title>Jornada ${parseInt(s.clave.slice(1))}: ${s.puntos} pts (acumulado ${s.acumulado})</title>
        </circle>`).join("")}
      ${lineasComparadas}
      ${claves.map((k, i) => claves.length <= 20 || i % 3 === 0
        ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" fill="#9ca3af" font-size="10" text-anchor="middle">${parseInt(k.slice(1))}</text>`
        : "").join("")}
    </svg>`;
}

iniciar();
</script>
</body>
</html>
