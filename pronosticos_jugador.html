<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronósticos del jugador · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
<style>
  .partido .linea-pronostico {
    grid-column: 1 / -1; text-align: center; font-size: 0.85em; margin-top: 6px;
    padding-top: 6px; border-top: 1px dashed #3a3a3a;
  }
  .partido .linea-pronostico .etiqueta { color: #7d7d7d; margin-right: 4px; }

  /* 2 partidos en paralelo por fila (con 10 partidos, 5 filas de 2). En
     pantallas estrechas se cae a una sola columna para que no se apriete. */
  .lista-partidos { grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .lista-partidos { grid-template-columns: 1fr; } }

  .fila-acciones-pronosticos { text-align: center; margin: 4px 0 18px; }
</style>
</head>
<body>

<div class="container">
  <p style="text-align:center">
    <a href="perfil.html?j=" id="enlace-perfil" class="mult-link">← Volver al perfil</a>
  </p>
  <div id="barra-jornadas"></div>
  <div class="fila-acciones-pronosticos">
    <button type="button" class="btn-ver-todas" id="btn-todas">Ver todas las jornadas</button>
  </div>
  <div id="contenido"></div>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "🗒️ Pronósticos de un jugador",
  pagina: "participantes",
});

let CALENDARIO = {}, REALIDAD = {}, CLAS = null, CLAVES = [], indice = 0, barra = null, JUGADOR = null, SLUG = null;

async function iniciar() {
  const parametros = new URLSearchParams(location.search);
  const slug = parametros.get("j");
  const jornadaPedida = parametros.get("jornada");

  CLAS = await cargar("data/clasificacion.json", null);
  CALENDARIO = await cargar("config/calendario.json", {});
  REALIDAD = await cargar("data/resultados/realidad_oficial.json", {});
  CLAVES = ordenJornadas(Object.keys(CALENDARIO));

  if (!slug || !CLAS) {
    document.getElementById("contenido").innerHTML =
      `<div class="vacio">Falta indicar de qué jugador (?j=slug). Vuelve al <a href="participantes.html" class="mult-link">listado de participantes</a>.</div>`;
    return;
  }

  JUGADOR = CLAS.clasificacion.find((c) => c.slug === slug);
  if (!JUGADOR) {
    document.getElementById("contenido").innerHTML = `<div class="vacio">No se encuentra ese jugador.</div>`;
    return;
  }
  SLUG = slug;

  document.getElementById("enlace-perfil").href = `perfil.html?j=${slug}`;
  document.querySelector("header h1").textContent = `🗒️ Pronósticos de ${nombrePlano(JUGADOR)}`;
  document.querySelector("header .subtitulo")?.remove();

  if (!CLAVES.length) {
    document.getElementById("contenido").innerHTML = `<div class="vacio">Todavía no hay calendario.</div>`;
    return;
  }

  indice = jornadaPedida && CLAVES.includes(jornadaPedida) ? CLAVES.indexOf(jornadaPedida) : CLAVES.length - 1;

  barra = montarBarraJornadas("barra-jornadas", CLAVES, CLAVES[indice], (clave) => {
    indice = CLAVES.indexOf(clave);
    history.replaceState(null, "", `?j=${slug}&jornada=${clave}`);
    pintarUna();
  });
  document.getElementById("btn-todas").onclick = pintarTodas;

  pintarUna();
}

async function datosDeJornada(clave) {
  const partidos = CALENDARIO[clave] || [];
  if (!partidos.length) return null;

  // Lo evaluado (partido ya jugado) llega puntuado desde el análisis, con
  // colores de acierto/fallo. Lo que aún no se ha jugado se lee directo del
  // fichero del jugador — ya no hace falta descodificar nada, el marcador se
  // guarda en claro.
  const analisis = await cargar(`data/analisis/${clave}.json`, null);
  const jugadorAnalisis = analisis?.jugadores.find((j) => j.slug === SLUG);

  const crudo = await cargar(`participantes/${SLUG}/pronosticos/${clave}.json`, null);
  const prediccionesCrudas = Object.fromEntries(
    (crudo?.predicciones || [])
      .filter((p) => p.goles_local != null && p.goles_visitante != null)
      .map((p) => [p.id, { gl: p.goles_local, gv: p.goles_visitante }])
  );

  const reales = Object.fromEntries((REALIDAD[clave] || []).map((p) => [p.id, p]));
  return { partidos, jugadorAnalisis, prediccionesCrudas, reales };
}

function bloqueJornadaCompleto(clave, datos) {
  return `
    <div class="cabecera-jornada">
      <h3 id="ancla-${clave}">Jornada ${parseInt(clave.slice(1))}</h3>
    </div>
    <div class="lista-partidos">
      ${datos.partidos.map((p) => bloquePartido(p, datos.jugadorAnalisis, datos.prediccionesCrudas, datos.reales[p.id])).join("")}
    </div>`;
}

async function pintarUna() {
  const clave = CLAVES[indice];
  barra.marcarActiva(clave);

  const datos = await datosDeJornada(clave);
  document.getElementById("contenido").innerHTML = datos
    ? bloqueJornadaCompleto(clave, datos)
    : `<div class="vacio">Esta jornada no tiene partidos.</div>`;
}

async function pintarTodas() {
  document.getElementById("contenido").innerHTML = `<div class="vacio">Cargando todas las jornadas…</div>`;
  const todas = await Promise.all(CLAVES.map(async (c) => [c, await datosDeJornada(c)]));
  document.getElementById("contenido").innerHTML = todas
    .filter(([, datos]) => datos)
    .map(([c, datos]) => bloqueJornadaCompleto(c, datos))
    .join("");
  desplazarSiExiste(document.getElementById("ancla-" + CLAVES[indice]), { behavior: "smooth", block: "nearest" });
}

function bloquePartido(p, jugadorAnalisis, prediccionesCrudas, real) {
  const terminado = real && real.estado === "finished";

  let lineaPronostico;
  const predEvaluada = jugadorAnalisis?.predicciones[p.id];
  if (predEvaluada) {
    // Partido ya evaluado: se conoce si acertó o no, así que se colorea.
    const clase = predEvaluada.acierto_exacto ? "pred-exact" : predEvaluada.acierto_1x2 ? "pred-1x2" : "pred-miss";
    lineaPronostico = `<div class="linea-pronostico">
      <span class="etiqueta">Su pronóstico:</span>
      <span class="${clase}">${predEvaluada.pronostico}</span>
      <span class="${clase}">(${predEvaluada.puntos > 0 ? "+" + predEvaluada.puntos : "0"} pts)</span>
    </div>`;
  } else {
    const crudo = prediccionesCrudas[p.id];
    lineaPronostico = crudo
      ? `<div class="linea-pronostico"><span class="etiqueta">Su pronóstico:</span> ${crudo.gl}-${crudo.gv}</div>`
      : `<div class="linea-pronostico"><span class="etiqueta">Su pronóstico:</span> <span class="pred-miss">sin pronosticar</span></div>`;
  }

  return `
    <div class="partido ${terminado ? "jugado" : ""} ${esPartidoEnDirecto(real) ? "en-directo" : ""}">
      <span class="fecha-partido">${formatearFechaHora(p.fecha)}</span>
      <span class="equipo local">${p.local}${escudoHtml(p.id_escudo_local, p.local)}</span>
      ${marcadorPartido(real)}
      <span class="equipo visitante">${escudoHtml(p.id_escudo_visitante, p.visitante)}${p.visitante}</span>
      ${lineaPronostico}
    </div>`;
}

iniciar();
</script>
</body>
</html>
