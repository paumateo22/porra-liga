<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reglamento · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="container">
  <p class="nota" style="text-align:center">
    Este reglamento se genera directamente desde <code>config/settings.json</code>,
    el mismo fichero que usa el motor de puntuación. Si aquí pone un número, es
    exactamente el que se aplica al calcular los puntos.
  </p>
  <div id="contenido"></div>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "📜 Reglamento",
  subtitulo: "Las normas, tal y como las aplica el motor",
  pagina: "reglamento",
});

const NOMBRES_DESEMPATE = {
  jornadas_ganadas: "número de jornadas ganadas",
  aciertos_exactos: "aciertos exactos acumulados",
  aciertos_1x2: "aciertos 1X2 acumulados",
  puntos_totales: "puntos totales",
};

async function iniciar() {
  const s = await cargar("config/settings.json", null);
  if (!s) {
    document.getElementById("contenido").innerHTML =
      `<div class="vacio">No se pudo cargar la configuración.</div>`;
    return;
  }

  const p = s.puntuaciones, h = s.habilitadores || {};
  const bonus = p.bonus_rendimiento || { umbral_minimo: 0, tabla: {} };
  const pct = Math.round(p.porcentaje_minimo_participacion * 100);

  const bloques = [];

  bloques.push(seccion("Puntos por partido", `
    <div class="table-wrapper"><table>
      <thead><tr><th style="text-align:left">Concepto</th><th>Puntos</th><th style="text-align:left">Detalle</th></tr></thead>
      <tbody>
        <tr>
          <td style="text-align:left">Acierto 1X2</td>
          <td class="pts-totales">${h.acierto_1x2 === 0 ? "desactivado" : "+" + p.puntos_1x2}</td>
          <td style="text-align:left">Aciertas quién gana o el empate, sin importar el marcador.</td>
        </tr>
        <tr>
          <td style="text-align:left">Acierto exacto</td>
          <td class="pts-totales pred-exact">${h.acierto_exacto === 0 ? "desactivado" : "+" + p.puntos_exacto}</td>
          <td style="text-align:left">
            Se suma <strong>además</strong> del punto de 1X2, así que un marcador clavado
            vale <strong>${p.puntos_1x2 + p.puntos_exacto} puntos</strong> en total.
          </td>
        </tr>
      </tbody>
    </table></div>`));

  const filasBonus = Object.entries(bonus.tabla || {})
    .sort((a, b) => a[0] - b[0])
    .map(([aciertos, pts]) => `<tr><td>${aciertos} aciertos 1X2</td><td class="pts-totales">+${pts}</td></tr>`)
    .join("");

  bloques.push(seccion("Bonus de rendimiento", h.bonus_rendimiento === 0
    ? `<p class="vacio">Desactivado esta temporada.</p>`
    : `<p>Premio adicional al final de cada jornada según cuántos aciertos
       <strong>1X2</strong> hayas conseguido en ella. Por debajo de
       <strong>${bonus.umbral_minimo}</strong> aciertos no hay bonus.</p>
       <div class="table-wrapper"><table>
         <thead><tr><th style="text-align:left">Aciertos</th><th>Bonus</th></tr></thead>
         <tbody>${filasBonus}</tbody>
       </table></div>`));

  bloques.push(seccion("Ganador y perdedor de la jornada", h.ganador_perdedor_jornada === 0
    ? `<p class="vacio">Desactivado esta temporada.</p>`
    : `<ul>
        <li>Quien tenga <strong>más aciertos 1X2</strong> de la jornada:
            <span class="ganador-jornada">${p.ganador_jornada >= 0 ? "+" : ""}${p.ganador_jornada} punto</span>.</li>
        <li>Quien tenga <strong>menos aciertos 1X2</strong> de la jornada:
            <span class="perdedor-jornada">${p.perdedor_jornada} punto</span>.</li>
        <li>En caso de empate, <strong>todos</strong> los empatados en el máximo ganan
            y todos los empatados en el mínimo pierden.</li>
        <li>Si el máximo y el mínimo coinciden (todos empatados), no hay ni ganador ni perdedor.</li>
      </ul>
      <p class="nota">El criterio es siempre el número de aciertos 1X2, nunca los
      puntos totales: así el bonus de rendimiento no distorsiona quién ha acertado más partidos.</p>`));

  bloques.push(seccion("Requisito de participación", `
    <p>Para <strong>optar</strong> a ganador o perdedor de jornada hay que haber
    pronosticado <strong>más del ${pct} %</strong> de los partidos de esa jornada.</p>
    <p>Quien no llegue a ese umbral sigue sumando los puntos de sus aciertos, pero
    queda fuera del reparto. Evita que quien pronostica dos partidos se lleve el premio,
    y que quien apenas juega cargue con el castigo.</p>`));

  bloques.push(seccion("Cuándo se cierra una jornada", `
    <p>El ganador y el perdedor <strong>solo se asignan cuando todos los partidos de
    la jornada han terminado</strong>. Mientras la jornada está en curso los puntos de
    aciertos sí se actualizan en vivo, pero el reparto de
    ${p.ganador_jornada >= 0 ? "+" : ""}${p.ganador_jornada} / ${p.perdedor_jornada} espera.</p>
    <p>Esto importa con los <strong>partidos aplazados</strong>: una jornada con un
    partido pendiente en marzo no reparte ganador hasta marzo, aunque el resto se haya
    jugado en septiembre.</p>`));

  bloques.push(seccion("Cierre de pronósticos", `
    <p><strong>El cierre es por partido, no por jornada.</strong> Cada partido se
    bloquea en cuanto llega su hora, independientemente del resto.</p>
    <ul>
      <li>Puedes <strong>mandar la misma jornada tantas veces como quieras</strong>.
          Cada envío se fusiona con lo anterior, no lo sustituye.</li>
      <li>Los partidos <strong>ya jugados no se pueden tocar</strong>: se conserva el
          pronóstico que enviaste en su momento.</li>
      <li>Los partidos <strong>aún sin jugar sí se actualizan</strong>, aunque otros de
          esa misma jornada ya se hayan disputado.</li>
    </ul>
    <p class="nota">El bloqueo se comprueba dos veces: en la web y otra vez al procesar
    el fichero. Editar el JSON a mano no sirve de nada.</p>`));

  bloques.push(seccion("Desempate en la clasificación general", `
    <p>A igualdad de puntos totales, por este orden:</p>
    <ol>${(s.desempates || []).map((d) => `<li>${NOMBRES_DESEMPATE[d] || d}</li>`).join("")}</ol>`));

  bloques.push(seccion("Cómo se participa", `
    <ol>
      <li>Entra en <a href="pronosticar.html" class="mult-link">✍️ Pronosticar</a> y escribe tu nombre.
          <strong>Usa siempre el mismo</strong>: es lo que te identifica.</li>
      <li>Elige la jornada y rellena los marcadores. Los partidos ya empezados salen bloqueados.</li>
      <li>Pulsa <em>Descargar mis pronósticos</em>. Obtendrás un fichero
          <code>J02_TuNombre.json</code>.</li>
      <li>Mándaselo al administrador. En cuanto lo procese, tus puntos aparecen en la
          <a href="index.html" class="mult-link">clasificación</a>.</li>
    </ol>
    <p class="nota">Si vuelves a la web después de que se haya procesado tu envío, al
    escribir tu nombre se recuperan los marcadores que mandaste.</p>`));

  bloques.push(seccion("Partidos adelantados y aplazados", `
    <p>Una jornada de LaLiga no siempre se juega entera el mismo fin de semana.
    El sistema lo contempla:</p>
    <ul>
      <li>Un partido <strong>adelantado</strong> (se juega meses antes que su jornada)
          puntúa en cuanto termina. Su jornada suma esos puntos pero sigue abierta.</li>
      <li>Un partido <strong>aplazado</strong> no impide que el resto de la jornada
          puntúe. El bonus se calcula sobre lo jugado hasta el momento y se ajusta solo
          cuando llega el partido pendiente.</li>
      <li>Puedes pronosticar un partido adelantado sin haber rellenado el resto de su
          jornada, y completar los demás más adelante.</li>
    </ul>`));

  bloques.push(seccion("Si no pronosticas", `
    <ul>
      <li>Un partido sin pronóstico simplemente <strong>no suma nada</strong>. No hay
          penalización por dejarlo en blanco.</li>
      <li>Pero cuenta para el <strong>umbral del ${pct} %</strong>: si dejas demasiados
          en blanco quedas fuera del reparto de ganador y perdedor de esa jornada.</li>
      <li>Una jornada entera sin pronosticar no aparece en tu historial y no cuenta
          como jornada jugada al calcular tu media.</li>
      <li>Un pronóstico que llega <strong>después</strong> de que el partido haya
          empezado se descarta. No se puede pronosticar hacia atrás.</li>
    </ul>`));

  bloques.push(seccion("Cómo se te identifica", `
    <p>El nombre que escribes en el formulario es tu identidad en toda la porra.
    Se convierte en una etiqueta interna en minúsculas y sin espacios (por ejemplo,
    <code>Nombre Apellido</code> pasa a ser <code>nombre_apellido</code>).</p>
    <p><strong>Escribe siempre el mismo nombre.</strong> Si una jornada pones tu
    nombre de una forma y otra de otra distinta, el sistema entiende que sois dos
    personas y tus puntos se reparten entre dos fichas.</p>
    <p class="nota">Mayúsculas y espacios sobrantes no importan. El navegador recuerda
    tu nombre, así que normalmente solo lo escribes la primera vez.</p>`));

  bloques.push(seccion("Preguntas frecuentes", `
    <p><strong>¿Puedo cambiar un pronóstico?</strong><br>
    Sí, tantas veces como quieras, mientras el partido no haya empezado. Vuelve a
    descargar la jornada y mándala otra vez: se fusiona con lo anterior.</p>

    <p><strong>¿Y si mando la jornada a medias?</strong><br>
    No pasa nada. Manda lo que tengas y completa el resto después. Cada envío se suma
    al anterior.</p>

    <p><strong>¿Puedo entrar a mitad de temporada?</strong><br>
    Sí. Si tu primer pronóstico no es en la primera jornada de la temporada,
    arrancas con los mismos puntos totales que llevara en ese momento quien
    fuera último — así no empiezas con la clasificación general imposible.
    Ojo: es solo un punto de salida, no cuenta como acierto ni como jornada
    ganada o perdida — esas estadísticas arrancan de cero contigo, igual que
    con cualquiera. Se indica en tu perfil para que quede claro de dónde
    sale.</p>

    <p><strong>¿Qué pasa si el resultado que veo no cuadra?</strong><br>
    Los resultados se toman de SofaScore automáticamente. Si detectas un error,
    avisa al administrador: se corrige y se recalcula la temporada entera al instante.</p>

    <p><strong>¿Se puede hacer trampa editando el fichero?</strong><br>
    No sirve de nada. Al procesarlo se comprueba otra vez qué partidos estaban
    abiertos, y los ids de partido tienen que coincidir con el calendario oficial.</p>

    <p><strong>¿Alguien puede ver mi pronóstico antes de que acabe la jornada?</strong><br>
    Sí, en toda la web: si alguien escribe tu nombre exacto en el formulario de
    pronosticar, o simplemente abre tu enlace en "pronósticos de un jugador",
    ve lo que ya has enviado, se haya jugado el partido o no. Es así a
    propósito, sin ninguna clave por medio, para que sea fácil de usar entre
    amigos.</p>`));

  document.getElementById("contenido").innerHTML = bloques.join("");
}

function seccion(titulo, html) {
  return `<details open><summary><h2>${titulo}</h2></summary>${html}</details>`;
}

iniciar();
</script>
</body>
</html>
