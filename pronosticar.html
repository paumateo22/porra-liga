<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronosticar · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
<style>
  .fila-nombre-compacta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .fila-nombre-compacta label { font-size: 0.78em; color: var(--table-header); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
  .campo-nombre-compacto {
    width: auto; max-width: 220px; padding: 7px 12px; border-radius: 5px; border: 1px solid #555;
    background: #111; color: #fff; font-size: 0.95em; text-align: left; outline: none;
  }
  .campo-nombre-compacto:focus { border-color: var(--gold); }
  .fila-nombre-compacta .nota { margin: 0; font-size: 0.8em; }
</style>
</head>
<body>

<div class="container">
  <details open>
    <summary><h2>Pronosticar</h2></summary>

    <div class="fila-nombre-compacta">
      <label for="nombre">Tu nombre</label>
      <input type="text" id="nombre" class="campo-nombre-compacto" placeholder="Ej. Mateo" autocomplete="off">
      <p class="nota">Usa siempre el mismo nombre: es lo que te identifica en la clasificación.</p>
    </div>

    <div id="barra-jornadas"></div>
    <div id="partidos" class="lista-partidos"></div>
  </details>
</div>

<div class="barra-acciones">
  <a href="javascript:void(0)" class="btn-participa" id="btn-descargar">⬇️ Descargar mis pronósticos</a>
  <a href="javascript:void(0)" class="btn-participa btn-imagen" id="btn-descargar-imagen">🖼️ Descargar imagen</a>
  <a href="javascript:void(0)" class="btn-participa btn-imagen" id="btn-copiar-imagen">📋 Copiar imagen</a>
  <div class="aviso" id="aviso"></div>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "✍️ Pronosticar",
  subtitulo: "Rellena, descarga el fichero y mándalo",
  pagina: "pronosticar",
});

let CALENDARIO = {}, REALIDAD = {}, CLAVES = [], indice = 0, barra = null;

const slug = (n) => n.trim().toLowerCase()
  .replace(/\s+/g, "_")
  .replace(/[^\w_áéíóúüñ]/gu, "");

async function iniciar() {
  CALENDARIO = await cargar("config/calendario.json", {});
  REALIDAD = await cargar("data/resultados/realidad_oficial.json", {});
  CLAVES = ordenJornadas(Object.keys(CALENDARIO));

  if (!CLAVES.length) {
    document.getElementById("partidos").innerHTML =
      `<div class="vacio">No hay calendario todavía.</div>`;
    return;
  }

  const nombre = document.getElementById("nombre");
  nombre.value = localStorage.getItem("porra_nombre") || "";
  nombre.oninput = () => {
    localStorage.setItem("porra_nombre", nombre.value);
    avisar("");
  };
  nombre.onblur = precargarGuardados;

  const jornadaPedida = new URLSearchParams(location.search).get("jornada");
  indice = jornadaPedida && CLAVES.includes(jornadaPedida)
    ? CLAVES.indexOf(jornadaPedida)
    : Math.max(0, CLAVES.indexOf(jornadaActual(REALIDAD, CLAVES)));
  document.getElementById("btn-descargar").onclick = descargar;
  document.getElementById("btn-descargar-imagen").onclick = descargarImagen;
  document.getElementById("btn-copiar-imagen").onclick = copiarImagen;

  barra = montarBarraJornadas("barra-jornadas", CLAVES, CLAVES[indice], (clave) => {
    indice = CLAVES.indexOf(clave);
    pintar();
  });

  pintar();
}

function pintar() {
  const clave = CLAVES[indice];
  barra.marcarActiva(clave);

  const reales = Object.fromEntries((REALIDAD[clave] || []).map((p) => [p.id, p]));

  document.getElementById("partidos").innerHTML = CALENDARIO[clave].map((p) => {
    const empezado = reales[p.id] && reales[p.id].estado !== "notstarted";
    return `
      <div class="partido">
        <span class="fecha-partido">${formatearFechaHora(p.fecha)}</span>
        <span class="equipo local">${p.local}${escudoHtml(p.id_escudo_local, p.local)}</span>
        <span class="entrada-marcador">
          <input type="number" min="0" max="30" inputmode="numeric"
                 data-id="${p.id}" data-lado="l" ${empezado ? "disabled" : ""}>
          <span>-</span>
          <input type="number" min="0" max="30" inputmode="numeric"
                 data-id="${p.id}" data-lado="v" ${empezado ? "disabled" : ""}>
        </span>
        <span class="equipo visitante">${escudoHtml(p.id_escudo_visitante, p.visitante)}${p.visitante}</span>
      </div>`;
  }).join("");

  avisar("");
  PREVIOS = {};
  marcarBloqueados();
  precargarGuardados();
}

/* Pronósticos ya enviados de la jornada visible: {id: {gl, gv}}, ya
   descodificados en memoria (el fichero guarda el marcador ofuscado). */
let PREVIOS = {};

/* Si ya mandaste esta jornada, se recuperan tus marcadores del repo. El
   fichero guarda el marcador ofuscado (campo "marcador"); se descodifica
   aquí, en memoria, solo para rellenar los campos del formulario. */
async function precargarGuardados() {
  const nombre = document.getElementById("nombre").value;
  if (!nombre.trim()) return;
  const clave = CLAVES[indice];
  const s = slug(nombre);
  const datos = await cargar(`participantes/${s}/pronosticos/${clave}.json`, null);
  if (!datos) {
    PREVIOS = {};
    marcarBloqueados();
    return;
  }

  PREVIOS = Object.fromEntries(
    datos.predicciones
      .filter((p) => p.marcador)
      .map((p) => [p.id, desofuscarMarcador(p.marcador, p.fecha, clave)])
  );

  for (const pred of datos.predicciones) {
    if (!pred.marcador) continue;
    const { gl, gv } = desofuscarMarcador(pred.marcador, pred.fecha, clave);
    const l = document.querySelector(`input[data-id="${pred.id}"][data-lado="l"]`);
    const v = document.querySelector(`input[data-id="${pred.id}"][data-lado="v"]`);
    if (l && !l.value) l.value = gl;
    if (v && !v.value) v.value = gv;
  }
  marcarBloqueados();
  avisar(`Recuperados tus pronósticos ya enviados de ${clave}. Puedes cambiar los partidos que aún no se han jugado.`, "ok");
}

/* Etiqueta cada partido cerrado según si tenías o no pronóstico guardado. */
function marcarBloqueados() {
  const reales = Object.fromEntries((REALIDAD[CLAVES[indice]] || []).map((p) => [p.id, p]));
  for (const l of document.querySelectorAll('input[data-lado="l"][disabled]')) {
    const fila = l.closest(".partido");
    fila.querySelector(".etiqueta-bloqueo")?.remove();
    const id = parseInt(l.dataset.id);
    const enDirecto = esPartidoEnDirecto(reales[id]);
    let texto;
    if (enDirecto) texto = "⚽ en directo ahora mismo";
    else if (PREVIOS[id]) texto = "🔒 ya jugado · se conserva tu pronóstico";
    else texto = "🔒 ya jugado · sin pronóstico";
    fila.insertAdjacentHTML("beforeend",
      `<span class="etiqueta-bloqueo nota ${enDirecto ? "en-directo" : ""}" style="grid-column:1/-1;text-align:center">${texto}</span>`);
  }
}

/* El marcador va ofuscado en el JSON final (campo "marcador"), mezclado con
   la fecha del partido y la jornada — así el mismo 2-1 en dos partidos
   distintos no produce el mismo texto, y no hay patrón que reconocer a
   simple vista. No es cifrado real: la función que lo revierte vive en este
   mismo layout.js, público. Ver la nota en desofuscarMarcador.

   Se incluyen los 10 partidos de la jornada siempre, aunque no los hayas
   rellenado todos — los que faltan van con "marcador": null, para que se
   vea en el propio fichero qué partidos quedaron sin pronosticar. */
function recogerPredicciones() {
  const clave = CLAVES[indice];
  const predicciones = [];
  let incompletos = 0, conservados = 0;

  for (const p of CALENDARIO[clave]) {
    const l = document.querySelector(`input[data-id="${p.id}"][data-lado="l"]`);
    const v = document.querySelector(`input[data-id="${p.id}"][data-lado="v"]`);
    const base = { id: p.id, local: p.local, visitante: p.visitante, fecha: p.fecha };

    // Partido ya empezado: se arrastra el pronóstico que ya habías enviado.
    if (l.disabled) {
      const previo = PREVIOS[p.id];
      if (previo) {
        predicciones.push({ ...base, marcador: ofuscarMarcador(previo.gl, previo.gv, p.fecha, clave) });
        conservados++;
      } else {
        predicciones.push({ ...base, marcador: null });
      }
      continue;
    }

    if (l.value === "" || v.value === "") {
      incompletos++;
      predicciones.push({ ...base, marcador: null });
      continue;
    }
    predicciones.push({ ...base, marcador: ofuscarMarcador(parseInt(l.value), parseInt(v.value), p.fecha, clave) });
  }
  return { predicciones, incompletos, conservados };
}

function descargar() {
  const nombre = document.getElementById("nombre").value.trim();
  if (!nombre) return avisar("Escribe tu nombre antes de descargar.", "error");

  const clave = CLAVES[indice];
  const { predicciones, incompletos, conservados } = recogerPredicciones();
  const rellenados = predicciones.filter((p) => p.marcador).length;

  if (!rellenados) return avisar("No has rellenado ningún marcador.", "error");
  if (incompletos && !confirm(`Te faltan ${incompletos} partidos por rellenar. ¿Descargar igualmente?`)) return;

  const contenido = {
    participante: nombre,
    jornada: parseInt(clave.slice(1)),
    generado: new Date().toISOString().slice(0, 19),
    predicciones,
  };

  const blob = new Blob([JSON.stringify(contenido, null, 4)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${clave}_${nombre.replace(/\s+/g, "")}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);

  avisar(`Descargado ${a.download} con ${rellenados} partidos`
    + (conservados ? ` (${conservados} ya jugados, conservados tal cual)` : "")
    + `. Ahora mándalo.`, "ok");
}

function avisar(texto, clase = "") {
  const aviso = document.getElementById("aviso");
  aviso.textContent = texto;
  aviso.className = `aviso ${clase}`;
}

/* Dibuja en un <canvas> todos los pronósticos de la jornada visible, tal
   como están puestos en el formulario ahora mismo (partido sin rellenar =
   "—"). No se usa ninguna librería: solo Canvas 2D nativo. */
function dibujarImagenJornada() {
  const nombre = document.getElementById("nombre").value.trim() || "Sin nombre";
  const clave = CLAVES[indice];
  const partidos = CALENDARIO[clave].map((p) => {
    const l = document.querySelector(`input[data-id="${p.id}"][data-lado="l"]`);
    const v = document.querySelector(`input[data-id="${p.id}"][data-lado="v"]`);
    const marcador = (l?.value !== "" && v?.value !== "" && l?.value != null && v?.value != null)
      ? `${l.value} - ${v.value}` : "—";
    return { local: p.local, visitante: p.visitante, marcador };
  });

  const ANCHO = 640, ALTO_FILA = 46, ALTO_CABECERA = 96, ALTO_PIE = 26;
  const alto = ALTO_CABECERA + partidos.length * ALTO_FILA + ALTO_PIE;

  const canvas = document.createElement("canvas");
  canvas.width = ANCHO;
  canvas.height = alto;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#121212";
  ctx.fillRect(0, 0, ANCHO, alto);

  const degradado = ctx.createLinearGradient(0, 0, ANCHO, 0);
  degradado.addColorStop(0, "#1a2a6c");
  degradado.addColorStop(1, "#2b5876");
  ctx.fillStyle = degradado;
  ctx.fillRect(0, 0, ANCHO, ALTO_CABECERA);

  ctx.textAlign = "center";
  ctx.fillStyle = "goldenrod";
  ctx.font = "bold 24px 'Segoe UI', Tahoma, sans-serif";
  ctx.fillText(`Pronósticos de ${nombre}`, ANCHO / 2, 42);
  ctx.fillStyle = "#b0c4de";
  ctx.font = "16px 'Segoe UI', Tahoma, sans-serif";
  ctx.fillText(`Jornada ${parseInt(clave.slice(1))} · LaLiga 2026-27`, ANCHO / 2, 70);

  partidos.forEach((p, i) => {
    const y = ALTO_CABECERA + i * ALTO_FILA;
    const centroY = y + ALTO_FILA / 2 + 5;

    ctx.fillStyle = i % 2 === 0 ? "#1c1c1c" : "#232323";
    ctx.fillRect(0, y, ANCHO, ALTO_FILA);

    ctx.font = "15px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "right";
    ctx.fillText(recortarTexto(ctx, p.local, 220), ANCHO / 2 - 46, centroY);

    ctx.font = "bold 17px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = p.marcador === "—" ? "#666" : "goldenrod";
    ctx.textAlign = "center";
    ctx.fillText(p.marcador, ANCHO / 2, centroY);

    ctx.font = "15px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText(recortarTexto(ctx, p.visitante, 220), ANCHO / 2 + 46, centroY);
  });

  ctx.fillStyle = "#555";
  ctx.font = "11px 'Segoe UI', Tahoma, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Porra LaLiga", ANCHO / 2, alto - 9);

  return canvas;
}

function recortarTexto(ctx, texto, anchoMax) {
  if (ctx.measureText(texto).width <= anchoMax) return texto;
  let recortado = texto;
  while (recortado.length > 1 && ctx.measureText(recortado + "…").width > anchoMax) {
    recortado = recortado.slice(0, -1);
  }
  return recortado + "…";
}

function descargarImagen() {
  const canvas = dibujarImagenJornada();
  const nombre = (document.getElementById("nombre").value.trim() || "pronosticos").replace(/\s+/g, "");
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = `${CLAVES[indice]}_${nombre}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  avisar(`Descargada ${a.download}.`, "ok");
}

function copiarImagen() {
  const canvas = dibujarImagenJornada();
  canvas.toBlob(async (blob) => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
      avisar("Imagen copiada al portapapeles — ya puedes pegarla donde quieras.", "ok");
    } catch (e) {
      avisar("Tu navegador no permite copiar la imagen directamente — usa \"Descargar imagen\" en su lugar.", "error");
    }
  }, "image/png");
}


iniciar();
</script>
</body>
</html>
