name: Actualizar Porra

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  motor:
    runs-on: self-hosted
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cascada completa (ingesta + resultados + motor)
        run: |
          python scripts/03_ingesta_pronosticos.py
          python scripts/05_extractor_sofascore.py
          python scripts/06_motor_puntuacion.py

      - name: Guardar cambios y subir a GitHub (Auto-Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace($changes)) {
            git commit -m "Auto-Update: pronosticos ingeridos y puntuacion recalculada"
            git push
          } else {
            Write-Host "No hay cambios reales para guardar. Saltando commit."
          }
