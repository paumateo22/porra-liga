name: Procesar Pronosticos del Buzon

on:
  push:
    paths:
      - 'entradas/*.json'
    branches:
      - main

permissions:
  contents: write
  actions: write

# Mismo grupo que actualizador.yml a propósito: ambos tocan los mismos
# ficheros (config/participantes.json, data/clasificacion.json...) en el
# mismo runner, así que no pueden correr a la vez sin arriesgarse a pisarse.
concurrency:
  group: actualizador-porra
  cancel-in-progress: false

jobs:
  ingerir:
    runs-on: self-hosted
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install -r requirements.txt --break-system-packages

      - name: Regenerar calendario (fechas confirmadas de SofaScore)
        run: python scripts/00_generador_calendario.py

      - name: Ingerir pronosticos y recalcular
        run: |
          python scripts/03_ingesta_pronosticos.py
          python scripts/06_motor_puntuacion.py

      - name: Guardar cambios y subir a GitHub (Auto-Commit)
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto-Update: pronosticos ingeridos"
            git push
          else
            echo "No hay cambios reales para guardar."
          fi

      - name: Lanzar Actualizador (resultados + recalculo completo)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/actualizador.yml/dispatches" \
            -d '{"ref":"main"}'