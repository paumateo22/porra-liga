name: Procesar Pronosticos del Buzon

on:
  push:
    paths:
      - 'entradas/*.json'
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  ingerir:
    runs-on: self-hosted
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar librerias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingerir pronosticos y recalcular
        run: |
          python scripts/03_ingesta_pronosticos.py
          python scripts/06_motor_puntuacion.py

      - name: Guardar cambios y subir a GitHub (Auto-Commit)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          $changes = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace($changes)) {
            git commit -m "Auto-Update: pronosticos ingeridos"
            git push
          } else {
            Write-Host "No hay cambios reales para guardar."
          }
