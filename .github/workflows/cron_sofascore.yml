# Este workflow lo dispara un vigía externo que corre en tu propia
# Raspberry (ver ~/vigia-partidos/), que comprueba cada 5 minutos — sin
# tocar GitHub para nada en esa comprobación — si de verdad ha cambiado
# algo (calendario confirmado, partido que ha empezado o terminado, gol).
# Solo cuando detecta un cambio real, dispara este workflow, que es quien
# hace el commit de verdad y desencadena el recálculo completo.
#
# Por eso este workflow ya NO necesita bucear él solo cada 5 minutos ni
# dispararse por "schedule" — esa responsabilidad ya la lleva el vigía, y
# el scheduler de GitHub tampoco garantizaba la hora exacta de todos modos.
name: Scraper Horario SofaScore

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: actualizador-porra
  cancel-in-progress: false

jobs:
  actualizar-resultados:
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - name: Comprobar ventana de temporada (LaLiga 2026-27)
        id: date_check
        shell: bash
        run: |
          TODAY=$(date +%Y%m%d)
          START="20260814"
          END="20270601"

          if [ "$TODAY" -ge "$START" ] && [ "$TODAY" -le "$END" ]; then
            echo "is_active=true" >> "$GITHUB_OUTPUT"
            echo "Dentro de temporada."
          else
            echo "is_active=false" >> "$GITHUB_OUTPUT"
            echo "Fuera de temporada. Abortando silenciosamente."
          fi

      - name: Clonar el repositorio
        if: steps.date_check.outputs.is_active == 'true'
        uses: actions/checkout@v4

      - name: Instalar librerias
        if: steps.date_check.outputs.is_active == 'true'
        run: |
          python -m pip install --upgrade pip --break-system-packages
          pip install -r requirements.txt --break-system-packages

      - name: Ejecutar Extractor SofaScore
        if: steps.date_check.outputs.is_active == 'true'
        run: python scripts/05_extractor_sofascore.py

      - name: Guardar cambios (Auto-Commit)
        if: steps.date_check.outputs.is_active == 'true'
        id: commit_step
        shell: bash
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/resultados/realidad_oficial.json

          if [ -z "$(git status --porcelain)" ]; then
            echo "No hay cambios nuevos en los resultados."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-Update: resultados actualizados desde SofaScore"
            git push
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lanzar Actualizador Global
        if: steps.commit_step.outputs.has_changes == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/actualizador.yml/dispatches" \
            -d '{"ref":"main"}' > /dev/null
