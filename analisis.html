<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de jornada · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
<style>
  .banner-resultado { display: flex; gap: 16px; flex-wrap: wrap; margin: 20px 0; }
  .fila-acciones-imagen { text-align: center; margin: -8px 0 20px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .btn-imagen-analisis {
    font-size: 0.8em; padding: 7px 16px; text-decoration: none; text-transform: none;
    background: #252525; color: var(--gold); border: 1px solid var(--gold); border-radius: 20px;
    transition: 0.2s; display: inline-block;
  }
  .btn-imagen-analisis:hover { background: var(--gold); color: #000; }
  #aviso-imagen { font-size: 0.85em; color: #9ca3af; }
  .tarjeta-banner { flex: 1; min-width: 220px; border-radius: 10px; padding: 18px 20px; text-align: center; }
  .tarjeta-banner.campeon { background: linear-gradient(180deg, #4a3a0a, #2a2205); border: 2px solid var(--gold); }
  .tarjeta-banner.perdedores { background: #1c1c1c; border: 2px solid #444; }
  .tarjeta-banner .etiqueta { font-size: 0.8em; text-transform: uppercase; letter-spacing: 1.5px; color: #b0b0b0; margin-bottom: 6px; }
  .tarjeta-banner.campeon .etiqueta { color: #f0d98a; }
  .tarjeta-banner .nombres { font-size: 1.6em; font-weight: 900; color: #fff; }
  .tarjeta-banner.campeon .nombres { color: var(--gold); }
  .tarjeta-banner .aciertos-pie { margin-top: 6px; font-size: 0.85em; color: #9ca3af; }
  .tarjeta-banner .aviso-estado { margin-top: 8px; font-size: 0.72em; padding: 3px 10px; border-radius: 10px; display: inline-block; }
  .tarjeta-banner .aviso-estado.provisional { background: rgba(96,165,250,0.15); color: #60a5fa; }
  .tarjeta-banner .aviso-estado.seguro { background: rgba(74,222,128,0.15); color: #4ade80; }

  table.tabla-analisis { table-layout: fixed; width: 100%; font-size: 0.72em; }
  table.tabla-analisis td, table.tabla-analisis th { padding: 5px 3px; text-align: center; }
  table.tabla-analisis th.col-jugador, table.tabla-analisis td.col-jugador {
    width: 78px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  table.tabla-analisis th.col-total, table.tabla-analisis td.col-total { width: 44px; }
  table.tabla-analisis thead .cabecera-partido { display: flex; align-items: center; justify-content: center; gap: 3px; white-space: nowrap; }
  table.tabla-analisis thead .cabecera-partido img.escudo { flex-shrink: 0; }
  table.tabla-analisis thead .marcador-cabecera { color: var(--gold); font-weight: 700; font-size: 0.95em; }
  .celda-pronostico { line-height: 1.25; }
  .celda-pronostico .pts { display: block; font-size: 0.82em; font-weight: 600; }
  .celda-pronostico .pred-miss.pts { color: #6b7280; }

  #grafico-barras svg text { font-family: inherit; }
</style>
</head>
<body>

<div class="container">
  <div id="barra-jornadas"></div>

  <div id="banner-resultado"></div>

  <div class="fila-acciones-imagen" id="fila-acciones-imagen" hidden>
    <a href="javascript:void(0)" class="btn-imagen-analisis" id="btn-descargar-imagen-analisis">🖼️ Descargar imagen</a>
    <a href="javascript:void(0)" class="btn-imagen-analisis" id="btn-copiar-imagen-analisis">📋 Copiar imagen</a>
    <span class="aviso" id="aviso-imagen"></span>
  </div>

  <div class="table-wrapper">
    <table class="tabla-analisis" id="tabla-cruzada"></table>
  </div>

  <div id="grafico-barras" style="margin-top:26px"></div>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "🔍 Análisis de jornada",
  pagina: "analisis",
});

let CLAVES = [], indice = 0, DATOS = null, barra = null, CALENDARIO = {}, REALIDAD = {}, PARTICIPANTES = [];

async function iniciar() {
  CALENDARIO = await cargar("config/calendario.json", {});
  REALIDAD = await cargar("data/resultados/realidad_oficial.json", {});
  CLAVES = ordenJornadas(Object.keys(CALENDARIO));

  if (!CLAVES.length) {
    document.getElementById("banner-resultado").innerHTML =
      `<div class="vacio">Todavía no hay calendario. Ejecuta el script 00.</div>`;
    return;
  }

  // La lista de participantes sale de data/clasificacion.json (ya incluye a
  // TODOS los registrados, aunque tengan 0 puntos) — no de
  // config/participantes.json, que es un fichero interno del motor y no
  // tiene por qué estar publicado en el sitio.
  const clas = await cargar("data/clasificacion.json", null);
  PARTICIPANTES = clas ? clas.clasificacion.map((c) => ({ slug: c.slug, nombre: c.nombre })) : [];

  // Por defecto: la última jornada con análisis ya calculado. Si ninguna se
  // ha calculado todavía (temporada recién reseteada), se abre en la primera
  // del calendario y se muestra vacía con su propio aviso. Si la URL pide una
  // jornada concreta (?jornada=J05, por ejemplo desde el atajo del calendario),
  // esa gana siempre a la que se elegiría por defecto.
  const jornadaPedida = new URLSearchParams(location.search).get("jornada");
  let claveInicial;
  if (jornadaPedida && CLAVES.includes(jornadaPedida)) {
    claveInicial = jornadaPedida;
  } else {
    const calculadas = clas ? ordenJornadas(clas.jornadas_calculadas.slice()) : [];
    claveInicial = calculadas.length ? calculadas[calculadas.length - 1] : CLAVES[0];
  }
  indice = CLAVES.indexOf(claveInicial);

  barra = montarBarraJornadas("barra-jornadas", CLAVES, CLAVES[indice], (clave) => {
    indice = CLAVES.indexOf(clave);
    pintar();
  });
  document.getElementById("btn-descargar-imagen-analisis").onclick = descargarImagenAnalisis;
  document.getElementById("btn-copiar-imagen-analisis").onclick = copiarImagenAnalisis;

  pintar();
}

async function pintar() {
  const clave = CLAVES[indice];
  barra.marcarActiva(clave);

  DATOS = await cargar(`data/analisis/${clave}.json`, null);
  document.getElementById("fila-acciones-imagen").hidden = !DATOS;
  if (DATOS) {
    pintarBanner();
    pintarBarras();
  } else {
    document.getElementById("banner-resultado").innerHTML =
      `<div class="vacio">Todavía no hay ningún partido evaluado en la jornada ${parseInt(clave.slice(1))} — en cuanto empiece o termine alguno, aquí saldrá quién va ganando o perdiendo.</div>`;
    document.getElementById("grafico-barras").innerHTML = "";
  }

  // La tabla de pronósticos se pinta siempre, haya o no algo evaluado —
  // para eso lee también el fichero crudo de cada participante, no solo
  // lo que ya ha puntuado el motor.
  await pintarTabla(clave);
}

function pintarBanner() {
  const resultado = DATOS.resultado_jornada;

  if (!resultado) {
    document.getElementById("banner-resultado").innerHTML = `
      <div class="vacio">
        ${DATOS.cerrada
          ? "Todos empatados esta jornada: no hay campeón ni perdedor."
          : "Todavía no hay suficientes partidos jugados para saber quién va ganando o perdiendo."}
      </div>`;
    return;
  }

  const aciertosDe = (slug) => DATOS.jugadores.find((j) => j.slug === slug)?.aciertos_1x2 ?? 0;

  const avisoCampeon = DATOS.cerrada
    ? ""
    : resultado.ganador_seguro
      ? `<div class="aviso-estado seguro">✔ Ya es matemáticamente seguro</div>`
      : `<div class="aviso-estado provisional">⏳ Aún puede cambiar</div>`;
  const avisoPerdedor = DATOS.cerrada
    ? ""
    : resultado.perdedor_seguro
      ? `<div class="aviso-estado seguro">✔ Ya es matemáticamente seguro</div>`
      : `<div class="aviso-estado provisional">⏳ Aún puede cambiar</div>`;

  const enlaceNombrePorSlug = (g) => {
    const j = DATOS.jugadores.find((x) => x.slug === g.slug);
    return j ? enlaceNombre(j) : g.nombre;
  };

  document.getElementById("banner-resultado").innerHTML = `
    <div class="banner-resultado">
      <div class="tarjeta-banner campeon">
        <div class="etiqueta">🏆 ${DATOS.cerrada ? "Campeón" : "Va ganando"} de la jornada</div>
        <div class="nombres">${resultado.ganadores.map(enlaceNombrePorSlug).join(" y ")}</div>
        <div class="aciertos-pie">${aciertosDe(resultado.ganadores[0].slug)} aciertos 1X2</div>
        ${avisoCampeon}
      </div>
      <div class="tarjeta-banner perdedores">
        <div class="etiqueta">💀 ${DATOS.cerrada ? "Perdedores" : "Va perdiendo"} de la jornada</div>
        <div class="nombres">${resultado.perdedores.map(enlaceNombrePorSlug).join(" y ")}</div>
        <div class="aciertos-pie">${aciertosDe(resultado.perdedores[0].slug)} aciertos 1X2</div>
        ${avisoPerdedor}
      </div>
    </div>`;
}

async function datosTablaCompleta(clave) {
  const partidos = CALENDARIO[clave] || [];
  if (!partidos.length) return { partidos: [], resultados: {}, jugadores: [] };

  const resultados = DATOS?.resultados
    || Object.fromEntries((REALIDAD[clave] || []).map((r) => [r.id, r]));

  const evaluadosPorSlug = Object.fromEntries((DATOS?.jugadores || []).map((j) => [j.slug, j]));

  // El fichero crudo de cada participante para esta jornada — ya no hace
  // falta descodificar nada, el marcador se guarda en claro. Sirve para
  // enseñar el pronóstico de los partidos que el motor todavía no ha
  // evaluado (o de alguien que ni siquiera aparece en DATOS.jugadores
  // porque ninguno de sus partidos está evaluado todavía).
  const crudos = await Promise.all(PARTICIPANTES.map(async (p) => {
    const datos = await cargar(`participantes/${p.slug}/pronosticos/${clave}.json`, null);
    return [p.slug, datos];
  }));
  const crudosPorSlug = Object.fromEntries(crudos);

  const jugadores = PARTICIPANTES
    .map((p) => {
      const ev = evaluadosPorSlug[p.slug];
      const crudo = crudosPorSlug[p.slug];
      const prediccionesCrudas = Object.fromEntries(
        (crudo?.predicciones || [])
          .filter((pr) => pr.goles_local != null && pr.goles_visitante != null)
          .map((pr) => [pr.id, { gl: pr.goles_local, gv: pr.goles_visitante }])
      );
      return {
        slug: p.slug,
        nombre: ev?.nombre || p.nombre,
        insignias: ev?.insignias || [],
        puntos: ev?.puntos ?? 0,
        ganador: ev?.ganador || false,
        perdedor: ev?.perdedor || false,
        predicciones: ev?.predicciones || {},
        prediccionesCrudas,
      };
    })
    // Solo se descarta a quien no tiene NI pronóstico evaluado NI crudo para
    // esta jornada — no pintar una fila vacía de alguien que nunca mandó nada.
    .filter((j) => Object.keys(j.predicciones).length || Object.keys(j.prediccionesCrudas).length)
    .sort((a, b) => b.puntos - a.puntos);

  return { partidos, resultados, jugadores };
}

async function pintarTabla(clave) {
  const { partidos, resultados, jugadores } = await datosTablaCompleta(clave);
  if (!partidos.length) { document.getElementById("tabla-cruzada").innerHTML = ""; return; }

  const cabecera = `
    <thead><tr>
      <th class="col-jugador">Jugador</th>
      ${partidos.map((p) => {
        const r = resultados[p.id] || {};
        const enDirecto = esPartidoEnDirecto(r);
        const marcador = r.estado === "finished" ? `${r.goles_local}-${r.goles_visitante}`
          : enDirecto ? `${r.goles_local ?? 0}-${r.goles_visitante ?? 0}` : "-";
        return `<th title="${p.local} ${marcador} ${p.visitante}">
          <div class="cabecera-partido">
            ${escudoHtml(p.id_escudo_local, p.local, 18)}
            <span class="marcador-cabecera ${enDirecto ? "en-directo" : ""}">${marcador}${enDirecto ? ' <span class="balon-directo">⚽</span>' : ""}</span>
            ${escudoHtml(p.id_escudo_visitante, p.visitante, 18)}
          </div>
        </th>`;
      }).join("")}
      <th class="col-total">Total</th>
    </tr></thead>`;

  const cuerpo = `
    <tbody>
      ${jugadores.map((j) => `
        <tr>
          <td class="col-jugador">
            <a href="perfil.html?j=${j.slug}" class="mult-link">${nombreConInsignias(j)}</a>
          </td>
          ${partidos.map((p) => {
            const pred = j.predicciones[p.id];
            if (pred) {
              const clase = pred.acierto_exacto ? "pred-exact" : pred.acierto_1x2 ? "pred-1x2" : "pred-miss";
              return `<td class="celda-pronostico">
                <span class="${clase}">${pred.pronostico}</span>
                <span class="pts ${clase}">${pred.puntos > 0 ? "+" + pred.puntos : "0"} pts</span>
              </td>`;
            }
            const crudo = j.prediccionesCrudas[p.id];
            if (crudo) {
              return `<td class="celda-pronostico"><span class="pred-pendiente">${crudo.gl}-${crudo.gv}</span></td>`;
            }
            return `<td class="celda-pronostico pred-miss">—</td>`;
          }).join("")}
          <td class="col-total ${j.ganador ? "ganador-jornada" : j.perdedor ? "perdedor-jornada" : "pts-totales"}">${j.puntos}</td>
        </tr>`).join("")}
    </tbody>`;

  document.getElementById("tabla-cruzada").innerHTML = cabecera + cuerpo;
}

function pintarBarras() {
  const jugadores = [...DATOS.jugadores].sort((a, b) => b.puntos - a.puntos);
  if (!jugadores.length) { document.getElementById("grafico-barras").innerHTML = ""; return; }

  const W = 900, H = 260, M = { t: 15, r: 10, b: 34, l: 30 };
  const maxY = Math.max(...jugadores.map((j) => j.puntos), 1);
  const anchoBarra = (W - M.l - M.r) / jugadores.length;

  const y = (v) => H - M.b - (v / maxY) * (H - M.t - M.b);

  const barras = jugadores.map((j, i) => {
    const x = M.l + i * anchoBarra + anchoBarra * 0.12;
    const w = anchoBarra * 0.76;
    const alto = (H - M.b) - y(j.puntos);
    const opacidad = 0.45 + 0.55 * (j.puntos / maxY);

    const sumaPartidos = Object.values(j.predicciones).reduce((s, d) => s + d.puntos, 0);
    const extra = j.puntos - sumaPartidos - j.bonus;
    const desglose = [
      `${j.aciertos_1x2} aciertos 1X2 y ${j.aciertos_exactos} exactos → ${sumaPartidos} pts`,
      j.bonus ? `Bonus de rendimiento: +${j.bonus}` : null,
      extra ? `${extra > 0 ? "Ganador" : "Perdedor"} de la jornada: ${extra > 0 ? "+" : ""}${extra}` : null,
      `Total: ${j.puntos} pts`,
    ].filter(Boolean).join(" · ");

    return `
      <rect x="${x.toFixed(1)}" y="${y(j.puntos).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(alto, 0).toFixed(1)}"
            fill="goldenrod" fill-opacity="${opacidad.toFixed(2)}" rx="3">
        <title>${nombrePlano(j)}: ${desglose}</title>
      </rect>
      <text x="${(x + w / 2).toFixed(1)}" y="${(y(j.puntos) - 6).toFixed(1)}" text-anchor="middle" fill="#e0e0e0" font-size="12" font-weight="bold">${j.puntos}</text>
      <text x="${(x + w / 2).toFixed(1)}" y="${H - 12}" text-anchor="middle" fill="#9ca3af" font-size="11">${j.nombre.slice(0, 7)}${(j.insignias || []).map((i) => i.emoji).join("")}</text>`;
  }).join("");

  const lineasGuia = [0, Math.round(maxY / 2), maxY].map((v) => `
    <line x1="${M.l}" y1="${y(v).toFixed(1)}" x2="${W - M.r}" y2="${y(v).toFixed(1)}" stroke="#2a2a2a"/>
    <text x="4" y="${(y(v) + 4).toFixed(1)}" fill="#9ca3af" font-size="10">${v}</text>`).join("");

  document.getElementById("grafico-barras").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      ${lineasGuia}
      ${barras}
    </svg>`;
}

/* Dibuja en un <canvas> el estado actual de la jornada: quién va ganando y
   perdiendo (si lo hay) + la tabla completa de pronósticos de todos. La
   jornada sale siempre en el título — a diferencia de una simple captura de
   pantalla, aquí nunca hay dudas de qué jornada es. */
async function dibujarImagenAnalisis(conEscudos = true) {
  const clave = CLAVES[indice];
  const resultado = DATOS?.resultado_jornada;
  const { partidos, resultados, jugadores } = await datosTablaCompleta(clave);

  const escudos = {};
  if (conEscudos) {
    await Promise.all(partidos.flatMap((p) => [
      cargarImagenEscudo(p.id_escudo_local).then((img) => { escudos[p.id_escudo_local] = img; }),
      cargarImagenEscudo(p.id_escudo_visitante).then((img) => { escudos[p.id_escudo_visitante] = img; }),
    ]));
  }

  const ANCHO_JUGADOR = 140, ANCHO_PARTIDO = 96, ANCHO_TOTAL = 72;
  const ANCHO = ANCHO_JUGADOR + partidos.length * ANCHO_PARTIDO + ANCHO_TOTAL;
  const ALTO_TITULO = 52;
  const ALTO_BANNER = resultado ? 118 : 0;
  const ALTO_CABECERA = 60;
  const ALTO_FILA = 52;
  const ALTO_PIE = 26;
  const alto = ALTO_TITULO + ALTO_BANNER + ALTO_CABECERA + jugadores.length * ALTO_FILA + ALTO_PIE;

  const canvas = document.createElement("canvas");
  canvas.width = ANCHO;
  canvas.height = alto;
  const ctx = canvas.getContext("2d");

  ctx.fillStyle = "#121212";
  ctx.fillRect(0, 0, ANCHO, alto);

  ctx.textAlign = "center";
  ctx.fillStyle = "goldenrod";
  ctx.font = "bold 24px 'Segoe UI', Tahoma, sans-serif";
  ctx.fillText(`Jornada ${parseInt(clave.slice(1))} · LaLiga 2026-27`, ANCHO / 2, 34);

  let y = ALTO_TITULO;

  if (resultado) {
    const anchoCaja = (ANCHO - 24) / 2;
    const xIzq = 8, xDer = 16 + anchoCaja;
    const yCaja = y;
    const altoCaja = ALTO_BANNER - 10;
    const aciertosDe = (slug) => DATOS.jugadores.find((j) => j.slug === slug)?.aciertos_1x2 ?? 0;
    const nombresDe = (lista) => lista.map((g) => g.nombre).join(" y ");

    const degradadoGanador = ctx.createLinearGradient(0, yCaja, 0, yCaja + altoCaja);
    degradadoGanador.addColorStop(0, "#4a3a0a");
    degradadoGanador.addColorStop(1, "#2a2205");
    ctx.fillStyle = degradadoGanador;
    ctx.fillRect(xIzq, yCaja, anchoCaja, altoCaja);
    ctx.strokeStyle = "goldenrod";
    ctx.lineWidth = 2;
    ctx.strokeRect(xIzq, yCaja, anchoCaja, altoCaja);

    ctx.fillStyle = "#1c1c1c";
    ctx.fillRect(xDer, yCaja, anchoCaja, altoCaja);
    ctx.strokeStyle = "#444";
    ctx.strokeRect(xDer, yCaja, anchoCaja, altoCaja);

    ctx.textAlign = "center";
    ctx.font = "bold 12px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "#f0d98a";
    ctx.fillText((DATOS.cerrada ? "🏆 CAMPEÓN" : "🏆 VA GANANDO") + " DE LA JORNADA", xIzq + anchoCaja / 2, yCaja + 22);
    ctx.fillStyle = "#b0b0b0";
    ctx.fillText((DATOS.cerrada ? "💀 PERDEDOR" : "💀 VA PERDIENDO") + " DE LA JORNADA", xDer + anchoCaja / 2, yCaja + 22);

    ctx.font = "bold 20px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "goldenrod";
    ctx.fillText(recortarTexto(ctx, nombresDe(resultado.ganadores), anchoCaja - 24), xIzq + anchoCaja / 2, yCaja + 50);
    ctx.fillStyle = "#fff";
    ctx.fillText(recortarTexto(ctx, nombresDe(resultado.perdedores), anchoCaja - 24), xDer + anchoCaja / 2, yCaja + 50);

    ctx.font = "13px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "#d1d5db";
    ctx.fillText(`${aciertosDe(resultado.ganadores[0].slug)} aciertos 1X2`, xIzq + anchoCaja / 2, yCaja + 72);
    ctx.fillText(`${aciertosDe(resultado.perdedores[0].slug)} aciertos 1X2`, xDer + anchoCaja / 2, yCaja + 72);

    if (!DATOS.cerrada) {
      ctx.font = "12px 'Segoe UI', Tahoma, sans-serif";
      ctx.fillStyle = resultado.ganador_seguro ? "#4ade80" : "#60a5fa";
      ctx.fillText(resultado.ganador_seguro ? "✔ Ya es matemáticamente seguro" : "⏳ Aún puede cambiar",
        xIzq + anchoCaja / 2, yCaja + 94);
      ctx.fillStyle = resultado.perdedor_seguro ? "#4ade80" : "#60a5fa";
      ctx.fillText(resultado.perdedor_seguro ? "✔ Ya es matemáticamente seguro" : "⏳ Aún puede cambiar",
        xDer + anchoCaja / 2, yCaja + 94);
    }

    y += ALTO_BANNER;
  }

  const yCabecera = y;
  ctx.fillStyle = "#1a1a1a";
  ctx.fillRect(0, yCabecera, ANCHO, ALTO_CABECERA);
  ctx.textAlign = "left";
  ctx.font = "bold 12px 'Segoe UI', Tahoma, sans-serif";
  ctx.fillStyle = "goldenrod";
  ctx.fillText("JUGADOR", 12, yCabecera + 34);
  ctx.textAlign = "center";
  ctx.fillText("TOTAL", ANCHO_JUGADOR + partidos.length * ANCHO_PARTIDO + ANCHO_TOTAL / 2, yCabecera + 34);

  const TAM_ESCUDO_CAB = 18;
  partidos.forEach((p, i) => {
    const xCentro = ANCHO_JUGADOR + i * ANCHO_PARTIDO + ANCHO_PARTIDO / 2;
    const r = resultados[p.id] || {};
    const enDirecto = esPartidoEnDirecto(r);
    const marcador = r.estado === "finished" ? `${r.goles_local}-${r.goles_visitante}`
      : enDirecto ? `${r.goles_local ?? 0}-${r.goles_visitante ?? 0}` : "-";

    ctx.font = "bold 13px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = enDirecto ? "#4ade80" : "#fff";
    ctx.textAlign = "center";
    const anchoMarcador = ctx.measureText(marcador).width;
    ctx.fillText(marcador, xCentro, yCabecera + 24);
    const escudoL = escudos[p.id_escudo_local], escudoV = escudos[p.id_escudo_visitante];
    if (escudoL) ctx.drawImage(escudoL, xCentro - anchoMarcador / 2 - 6 - TAM_ESCUDO_CAB, yCabecera + 24 - TAM_ESCUDO_CAB + 4, TAM_ESCUDO_CAB, TAM_ESCUDO_CAB);
    if (escudoV) ctx.drawImage(escudoV, xCentro + anchoMarcador / 2 + 6, yCabecera + 24 - TAM_ESCUDO_CAB + 4, TAM_ESCUDO_CAB, TAM_ESCUDO_CAB);

    ctx.font = "10px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "#9ca3af";
    ctx.fillText(recortarTexto(ctx, `${p.local} - ${p.visitante}`, ANCHO_PARTIDO - 10), xCentro, yCabecera + 42);
  });

  y += ALTO_CABECERA;

  jugadores.forEach((j, fi) => {
    const yFila = y + fi * ALTO_FILA;
    ctx.fillStyle = fi % 2 === 0 ? "#1c1c1c" : "#232323";
    ctx.fillRect(0, yFila, ANCHO, ALTO_FILA);

    ctx.font = "13px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.textAlign = "left";
    ctx.fillText(recortarTexto(ctx, j.nombre, ANCHO_JUGADOR - 24), 12, yFila + ALTO_FILA / 2 + 5);

    partidos.forEach((p, pi) => {
      const xCentro = ANCHO_JUGADOR + pi * ANCHO_PARTIDO + ANCHO_PARTIDO / 2;
      const pred = j.predicciones[p.id];
      let texto1 = "—", texto2 = "", color = "#9ca3af";
      if (pred) {
        texto1 = pred.pronostico;
        texto2 = pred.puntos > 0 ? `+${pred.puntos} pts` : "0 pts";
        color = pred.acierto_exacto ? "#4ade80" : pred.acierto_1x2 ? "#60a5fa" : "#9ca3af";
      } else {
        const crudo = j.prediccionesCrudas[p.id];
        if (crudo) { texto1 = `${crudo.gl}-${crudo.gv}`; color = "#d1d5db"; }
      }
      ctx.textAlign = "center";
      ctx.font = "bold 13px 'Segoe UI', Tahoma, sans-serif";
      ctx.fillStyle = color;
      ctx.fillText(texto1, xCentro, yFila + ALTO_FILA / 2);
      if (texto2) {
        ctx.font = "10px 'Segoe UI', Tahoma, sans-serif";
        ctx.fillText(texto2, xCentro, yFila + ALTO_FILA / 2 + 15);
      }
    });

    const xTotal = ANCHO_JUGADOR + partidos.length * ANCHO_PARTIDO + ANCHO_TOTAL / 2;
    ctx.font = "bold 16px 'Segoe UI', Tahoma, sans-serif";
    ctx.fillStyle = j.ganador ? "#4ade80" : j.perdedor ? "#ff4c4c" : "goldenrod";
    ctx.textAlign = "center";
    ctx.fillText(String(j.puntos), xTotal, yFila + ALTO_FILA / 2 + 5);
  });

  ctx.fillStyle = "#555";
  ctx.font = "11px 'Segoe UI', Tahoma, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("Porra LaLiga", ANCHO / 2, alto - 8);

  return canvas;
}

async function descargarImagenAnalisis() {
  const aviso = document.getElementById("aviso-imagen");
  aviso.textContent = "Generando la imagen…";
  let canvas = await dibujarImagenAnalisis(true);
  let urlDatos;
  try {
    urlDatos = canvas.toDataURL("image/png");
  } catch (e) {
    // El CDN de los escudos no permite exportar el canvas (CORS) — se repite
    // sin escudos, para que la función no se quede rota por completo.
    canvas = await dibujarImagenAnalisis(false);
    urlDatos = canvas.toDataURL("image/png");
  }

  const clave = CLAVES[indice];
  const a = document.createElement("a");
  a.href = urlDatos;
  a.download = `${clave}_analisis.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  aviso.textContent = `Descargada ${a.download}.`;
}

async function copiarImagenAnalisis() {
  const aviso = document.getElementById("aviso-imagen");
  aviso.textContent = "Generando la imagen…";
  let canvas = await dibujarImagenAnalisis(true);
  let blob = await canvasABlob(canvas);
  if (!blob) {
    canvas = await dibujarImagenAnalisis(false);
    blob = await canvasABlob(canvas);
  }

  try {
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    aviso.textContent = "Imagen copiada al portapapeles — ya puedes pegarla donde quieras.";
  } catch (e) {
    aviso.textContent = "Tu navegador no permite copiar la imagen directamente — usa \"Descargar imagen\" en su lugar.";
  }
}

iniciar();
