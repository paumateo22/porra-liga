<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrera · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
<style>
  .carrera-layout { display: flex; gap: 20px; margin-top: 10px; align-items: flex-start; }
  .carrera-chart { flex: 7; background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; }
  .carrera-scoreboard { flex: 3; background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; }
  #marcador { position: relative; min-height: 50px; width: 100%; }
  .fila-jugador {
    position: absolute; left: 0; right: 0; height: 42px; background: #1a1a1a; border: 1px solid #333;
    border-radius: 6px; display: flex; align-items: center; padding: 0 10px; gap: 10px; box-sizing: border-box;
    transition: top 0.5s ease-out, background 0.3s;
  }
  .fila-jugador:hover { border-color: #666; background: #222; }
  .punto-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .fila-jugador .nombre { flex: 1; font-weight: 900; color: #eee; font-size: 0.9em; }
  .fila-jugador .puesto { width: 20px; text-align: center; color: #888; font-weight: bold; font-size: 0.85em; }
  .fila-jugador .total { font-weight: 900; font-size: 1.05em; color: #fff; width: 42px; text-align: right; }
  .fila-jugador .delta { width: 42px; text-align: right; font-weight: 900; font-size: 0.9em; }
  .hint-carrera { text-align: center; color: #888; font-size: 0.8em; margin-top: 12px; font-style: italic; }
  @media (max-width: 1000px) { .carrera-layout { flex-direction: column; } .carrera-chart, .carrera-scoreboard { flex: none; width: 100%; box-sizing: border-box; } }
</style>
</head>
<body>

<div class="container">
  <div class="selector-jornada">
    <button id="btn-anterior">⏮</button>
    <button id="btn-play">▶ Reproducir</button>
    <input type="range" id="barra" min="0" value="0" style="flex:1;min-width:160px;accent-color:goldenrod">
    <button id="btn-siguiente">⏭</button>
    <select id="velocidad">
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
      <option value="4">4x</option>
    </select>
    <span id="etiqueta" style="min-width:100px;color:var(--gold);font-weight:bold;text-align:center">—</span>
  </div>

  <div class="selector-jornada" style="margin-top:-8px">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.9em">
      <input type="checkbox" id="limite-cero" style="accent-color:goldenrod">
      Limitar eje a 0
    </label>
    <span style="color:#444">|</span>
    <label style="display:flex;align-items:center;gap:6px;font-size:0.9em">
      Centrar en:
      <select id="centrar-en">
        <option value="">Nadie (vista normal)</option>
      </select>
    </label>
  </div>

  <div class="carrera-layout">
    <div class="carrera-chart">
      <div id="grafico"></div>
    </div>
    <div class="carrera-scoreboard">
      <div id="marcador"></div>
      <p class="hint-carrera">💡 Toca un nombre para atenuarlo en la gráfica.</p>
    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "📈 Carrera",
  subtitulo: "Cómo ha evolucionado la clasificación, jornada a jornada",
  pagina: "carrera",
});

const COLORES = ["#e0a800", "#4ade80", "#60a5fa", "#f472b6", "#a78bfa",
                 "#fb923c", "#22d3ee", "#facc15", "#f87171", "#34d399",
                 "#c084fc", "#38bdf8"];

/* Progreso a lo largo del eje de jornadas: no es un índice entero, es un
   número real. 2.35 significa "un 35% de camino entre la jornada 3 y la 4".
   La animación mueve este número poco a poco en cada fotograma (vía
   requestAnimationFrame) e interpola los valores entre la jornada anterior y
   la siguiente — así la línea y el marcador se deslizan en vez de saltar de
   golpe de una jornada a otra. */
let CLAVES = [], SERIES = [], ocultos = new Set();
let progreso = 0, reproduciendo = false, ultimoTiempo = 0;
let limitarCero = false, centradoEn = "";
const VELOCIDAD_BASE = 1 / 900; // jornadas por milisegundo, a 1x

async function iniciar() {
  const clas = await cargar("data/clasificacion.json", null);
  if (!clas || !clas.clasificacion.length) {
    document.getElementById("grafico").innerHTML = `<div class="vacio">Todavía no hay jornadas calculadas.</div>`;
    return;
  }

  CLAVES = ordenJornadas(clas.jornadas_calculadas.slice());

  SERIES = clas.clasificacion.map((c, i) => {
    let acumulado = 0;
    return {
      slug: c.slug,
      nombre: c.nombre,
      insignias: c.insignias || [],
      color: COLORES[i % COLORES.length],
      puntos: CLAVES.map((k) => {
        const j = c.por_jornada[k];
        acumulado += j ? j.puntos : 0;
        return { acumulado, jornada: j ? j.puntos : null, ganador: j?.ganador, perdedor: j?.perdedor };
      }),
    };
  });

  construirMarcador();

  const selectorCentro = document.getElementById("centrar-en");
  SERIES.forEach((s) => {
    selectorCentro.insertAdjacentHTML("beforeend", `<option value="${s.slug}">${s.nombre}</option>`);
  });
  selectorCentro.onchange = () => { centradoEn = selectorCentro.value; renderizar(); };
  document.getElementById("limite-cero").onchange = (e) => { limitarCero = e.target.checked; renderizar(); };

  const barra = document.getElementById("barra");
  barra.max = CLAVES.length - 1;
  barra.value = CLAVES.length - 1;
  barra.oninput = () => { parar(); progreso = +barra.value; renderizar(); };
  document.getElementById("btn-play").onclick = alternar;
  document.getElementById("btn-anterior").onclick = () => {
    parar();
    progreso = Math.max(0, Math.round(progreso) - 1);
    barra.value = progreso;
    renderizar();
  };
  document.getElementById("btn-siguiente").onclick = () => {
    parar();
    progreso = Math.min(CLAVES.length - 1, Math.round(progreso) + 1);
    barra.value = progreso;
    renderizar();
  };

  progreso = CLAVES.length - 1;
  renderizar();
  requestAnimationFrame(bucleAnimacion);
}

function construirMarcador() {
  const cont = document.getElementById("marcador");
  cont.style.height = (SERIES.length * 48) + "px";
  cont.innerHTML = SERIES.map((s) => `
    <div class="fila-jugador" id="fila-${s.slug}" onclick="alternarJugador('${s.slug}')">
      <span class="puesto" id="puesto-${s.slug}">-</span>
      <span class="punto-color" style="background:${s.color}"></span>
      <span class="nombre"><a href="perfil.html?j=${s.slug}" class="enlace-jugador" onclick="event.stopPropagation()">${nombreConInsignias(s)}</a></span>
      <span class="total" id="total-${s.slug}">0</span>
      <span class="delta" id="delta-${s.slug}">+0</span>
    </div>`).join("");
}

function alternarJugador(slug) {
  if (ocultos.has(slug)) ocultos.delete(slug); else ocultos.add(slug);
  const fila = document.getElementById(`fila-${slug}`);
  fila.style.opacity = ocultos.has(slug) ? "0.3" : "1";
  fila.style.filter = ocultos.has(slug) ? "grayscale(100%)" : "none";
  renderizar();
}

function alternar() {
  if (reproduciendo) { parar(); return; }
  if (progreso >= CLAVES.length - 1) progreso = 0;
  reproduciendo = true;
  ultimoTiempo = 0; // se recalcula solo en el próximo fotograma
  document.getElementById("btn-play").textContent = "⏸ Pausa";
}

function parar() {
  reproduciendo = false;
  document.getElementById("btn-play").textContent = "▶ Reproducir";
}

function bucleAnimacion(tiempo) {
  if (reproduciendo) {
    if (!ultimoTiempo) ultimoTiempo = tiempo;
    const delta = tiempo - ultimoTiempo;
    ultimoTiempo = tiempo;
    const multiplicador = +document.getElementById("velocidad").value;

    progreso += delta * VELOCIDAD_BASE * multiplicador;
    if (progreso >= CLAVES.length - 1) { progreso = CLAVES.length - 1; parar(); }

    document.getElementById("barra").value = progreso;
    renderizar();
  }
  requestAnimationFrame(bucleAnimacion);
}

/* Valor interpolado de un jugador en el instante "progreso": una mezcla
   lineal entre lo que tenía en la jornada anterior y lo que tiene en la
   siguiente, según lo lejos que esté el progreso de cada una. */
function valorInterpolado(s, baseIdx, siguienteIdx, fraccion) {
  const a = s.puntos[baseIdx].acumulado;
  const b = s.puntos[siguienteIdx].acumulado;
  return a + (b - a) * fraccion;
}

function renderizar() {
  const baseIdx = Math.min(CLAVES.length - 1, Math.floor(progreso));
  const siguienteIdx = Math.min(baseIdx + 1, CLAVES.length - 1);
  const fraccion = progreso - baseIdx;
  // Con el progreso justo a medio camino, se pasa a mostrar la etiqueta y el
  // desglose de la jornada siguiente, no la anterior.
  const idxMostrado = fraccion < 0.5 ? baseIdx : siguienteIdx;

  document.getElementById("etiqueta").textContent = `Jornada ${parseInt(CLAVES[idxMostrado].slice(1))}`;
  pintarGrafico(baseIdx, siguienteIdx, fraccion);
  pintarMarcador(baseIdx, siguienteIdx, fraccion, idxMostrado);
}

function pintarGrafico(baseIdx, siguienteIdx, fraccion) {
  const W = 900, H = 400, M = { t: 20, r: 70, b: 30, l: 45 };
  const visibles = SERIES.filter((s) => !ocultos.has(s.slug));
  const referencia = centradoEn ? SERIES.find((s) => s.slug === centradoEn) : null;

  // Valor a dibujar de un jugador en una jornada concreta: el absoluto de
  // siempre, o su diferencia respecto al jugador de referencia si hay uno
  // centrado (0 = empatado con él, positivo = por delante, negativo = detrás).
  const valorEn = (s, idx) => {
    const abs = s.puntos[idx].acumulado;
    return referencia ? abs - referencia.puntos[idx].acumulado : abs;
  };
  const valorActualDe = (s) => {
    const abs = valorInterpolado(s, baseIdx, siguienteIdx, fraccion);
    return referencia ? abs - valorInterpolado(referencia, baseIdx, siguienteIdx, fraccion) : abs;
  };

  const actuales = visibles.map(valorActualDe);
  const historico = visibles.flatMap((s) => {
    const vals = [];
    for (let i = 0; i <= baseIdx; i++) vals.push(valorEn(s, i));
    return vals;
  });

  let maxY, minY;
  if (referencia) {
    // Centrado en un jugador: su propia línea es el 0, y se deja el mismo
    // margen arriba y abajo para que quede a media altura del gráfico.
    const extremo = Math.max(...actuales.map(Math.abs), ...historico.map(Math.abs), 5);
    maxY = extremo + 2;
    minY = -extremo - 2;
  } else if (limitarCero) {
    // Casilla marcada: el eje siempre incluye el 0, como antes.
    maxY = Math.max(...actuales, ...historico, 1);
    minY = Math.min(...actuales, ...historico, 0);
  } else {
    // Por defecto: sin anclar a 0 — solo un margen de ~5 puntos por debajo
    // del que va último ahora mismo, para separar mejor a los que van juntos.
    maxY = Math.max(...actuales, ...historico, 1);
    minY = Math.min(...actuales) - 5;
  }
  const rango = maxY - minY || 1;

  const x = (i) => M.l + (i * (W - M.l - M.r)) / Math.max(CLAVES.length - 1, 1);
  const y = (v) => H - M.b - ((v - minY) / rango) * (H - M.t - M.b);
  const formato = (v) => referencia && v > 0 ? `+${Math.round(v)}` : `${Math.round(v)}`;

  const fondoJornadas = CLAVES.map((k, i) => i % 2 === 0
    ? `<rect x="${x(i - 0.5).toFixed(1)}" y="${M.t}" width="${(x(i + 0.5) - x(i - 0.5)).toFixed(1)}"
             height="${H - M.t - M.b}" fill="rgba(255,255,255,0.02)"/>`
    : "").join("");

  const lineaReferencia = referencia
    ? `<line x1="${M.l}" y1="${y(0).toFixed(1)}" x2="${W - M.r}" y2="${y(0).toFixed(1)}"
             stroke="${referencia.color}" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>`
    : "";

  const lineas = visibles.map((s) => {
    const puntos = [];
    for (let i = 0; i <= baseIdx; i++) puntos.push({ x: i, y: valorEn(s, i) });
    const actual = valorActualDe(s);
    puntos.push({ x: baseIdx + fraccion, y: actual }); // el tramo "en vivo", interpolado

    const d = puntos.map((pt, i) => `${i ? "L" : "M"}${x(pt.x).toFixed(1)},${y(pt.y).toFixed(1)}`).join(" ");
    const px = x(baseIdx + fraccion);
    return `
      <path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${px.toFixed(1)}" cy="${y(actual).toFixed(1)}" r="4.5" fill="${s.color}"/>
      <text x="${(px + 8).toFixed(1)}" y="${(y(actual) + 4).toFixed(1)}"
            fill="${s.color}" font-size="11" font-weight="bold">${s.nombre.slice(0, 8)}${(s.insignias || []).map((i) => i.emoji).join("")} ${formato(actual)}</text>`;
  }).join("");

  document.getElementById("grafico").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${fondoJornadas}
      <line x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}" stroke="#444"/>
      <line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}" stroke="#444"/>
      ${lineaReferencia}
      <text x="8" y="${y(maxY) + 4}" fill="#9ca3af" font-size="11">${formato(maxY)}</text>
      <text x="8" y="${y(minY) + 4}" fill="#9ca3af" font-size="11">${formato(minY)}</text>
      ${CLAVES.map((k, i) => CLAVES.length <= 20 || i % 3 === 0
        ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" fill="#9ca3af" font-size="10" text-anchor="middle">${parseInt(k.slice(1))}</text>`
        : "").join("")}
      ${lineas}
    </svg>`;
}

function pintarMarcador(baseIdx, siguienteIdx, fraccion, idxMostrado) {
  const filas = SERIES.map((s) => ({
    slug: s.slug,
    total: valorInterpolado(s, baseIdx, siguienteIdx, fraccion),
    jornada: s.puntos[idxMostrado].jornada,
    ganador: s.puntos[idxMostrado].ganador,
    perdedor: s.puntos[idxMostrado].perdedor,
  })).sort((a, b) => b.total - a.total);

  filas.forEach((f, rank) => {
    const fila = document.getElementById(`fila-${f.slug}`);
    fila.style.top = (rank * 48 + 4) + "px";
    document.getElementById(`puesto-${f.slug}`).textContent = rank + 1;
    document.getElementById(`total-${f.slug}`).textContent = Math.round(f.total);

    const delta = document.getElementById(`delta-${f.slug}`);
    if (f.jornada === null) { delta.textContent = "—"; delta.style.color = "#666"; }
    else if (f.jornada === 0) { delta.textContent = "+0"; delta.style.color = "#666"; }
    else { delta.textContent = `+${f.jornada}`; delta.style.color = "#3b82f6"; }
    if (f.ganador) delta.style.color = "goldenrod";
    if (f.perdedor) delta.style.color = "#ff4c4c";
  });
}

iniciar();
</script>
</body>
</html>
