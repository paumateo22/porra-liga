<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrera · Porra LaLiga</title>
<link rel="stylesheet" href="theme.css">
<style>
  .carrera-layout { display: flex; gap: 20px; margin-top: 10px; align-items: flex-start; }
  .carrera-chart { flex: 7; background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; }
  .carrera-scoreboard { flex: 3; background: #111; border: 1px solid #333; border-radius: 8px; padding: 15px; }
  #marcador { position: relative; min-height: 50px; width: 100%; }
  .fila-jugador {
    position: absolute; left: 0; right: 0; height: 42px; background: #1a1a1a; border: 1px solid #333;
    border-radius: 6px; display: flex; align-items: center; padding: 0 10px; gap: 10px; box-sizing: border-box;
    transition: top 0.5s ease-out, background 0.3s;
  }
  .fila-jugador:hover { border-color: #666; background: #222; }
  .punto-color { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .fila-jugador .nombre { flex: 1; font-weight: 900; color: #eee; font-size: 0.9em; }
  .fila-jugador .puesto { width: 20px; text-align: center; color: #888; font-weight: bold; font-size: 0.85em; }
  .fila-jugador .total { font-weight: 900; font-size: 1.05em; color: #fff; width: 42px; text-align: right; }
  .fila-jugador .delta { width: 42px; text-align: right; font-weight: 900; font-size: 0.9em; }
  .hint-carrera { text-align: center; color: #888; font-size: 0.8em; margin-top: 12px; font-style: italic; }
  @media (max-width: 1000px) { .carrera-layout { flex-direction: column; } .carrera-chart, .carrera-scoreboard { flex: none; width: 100%; box-sizing: border-box; } }
</style>
</head>
<body>

<div class="container">
  <div class="selector-jornada">
    <button id="btn-anterior">⏮</button>
    <button id="btn-play">▶ Reproducir</button>
    <input type="range" id="barra" min="0" value="0" style="flex:1;min-width:160px;accent-color:goldenrod">
    <button id="btn-siguiente">⏭</button>
    <select id="velocidad">
      <option value="1200">0.5x</option>
      <option value="700" selected>1x</option>
      <option value="350">2x</option>
      <option value="150">4x</option>
    </select>
    <span id="etiqueta" style="min-width:100px;color:var(--gold);font-weight:bold;text-align:center">—</span>
  </div>

  <div class="carrera-layout">
    <div class="carrera-chart">
      <div id="grafico"></div>
    </div>
    <div class="carrera-scoreboard">
      <div id="marcador"></div>
      <p class="hint-carrera">💡 Toca un nombre para atenuarlo en la gráfica.</p>
    </div>
  </div>
</div>

<script src="layout.js"></script>
<script>
montarCabecera({
  titulo: "📈 Carrera",
  subtitulo: "Cómo ha evolucionado la clasificación, jornada a jornada",
  pagina: "carrera",
});

const COLORES = ["#e0a800", "#4ade80", "#60a5fa", "#f472b6", "#a78bfa",
                 "#fb923c", "#22d3ee", "#facc15", "#f87171", "#34d399",
                 "#c084fc", "#38bdf8"];

let CLAVES = [], SERIES = [], corriendo = null, ocultos = new Set();

async function iniciar() {
  const clas = await cargar("data/clasificacion.json", null);
  if (!clas || !clas.clasificacion.length) {
    document.getElementById("grafico").innerHTML = `<div class="vacio">Todavía no hay jornadas calculadas.</div>`;
    return;
  }

  CLAVES = ordenJornadas(clas.jornadas_calculadas.slice());

  SERIES = clas.clasificacion.map((c, i) => {
    let acumulado = 0;
    return {
      slug: c.slug,
      nombre: c.nombre,
      color: COLORES[i % COLORES.length],
      puntos: CLAVES.map((k) => {
        const j = c.por_jornada[k];
        acumulado += j ? j.puntos : 0;
        return { acumulado, jornada: j ? j.puntos : null, ganador: j?.ganador, perdedor: j?.perdedor };
      }),
    };
  });

  construirMarcador();

  const barra = document.getElementById("barra");
  barra.max = CLAVES.length - 1;
  barra.value = CLAVES.length - 1;
  barra.oninput = () => { parar(); pintar(+barra.value); };
  document.getElementById("btn-play").onclick = alternar;
  document.getElementById("btn-anterior").onclick = () => { parar(); pintar(Math.max(0, +barra.value - 1)); barra.value = progresoActual; };
  document.getElementById("btn-siguiente").onclick = () => { parar(); pintar(Math.min(CLAVES.length - 1, +barra.value + 1)); barra.value = progresoActual; };

  pintar(CLAVES.length - 1);
}

let progresoActual = 0;

function construirMarcador() {
  const cont = document.getElementById("marcador");
  cont.style.height = (SERIES.length * 48) + "px";
  cont.innerHTML = SERIES.map((s) => `
    <div class="fila-jugador" id="fila-${s.slug}" onclick="alternarJugador('${s.slug}')">
      <span class="puesto" id="puesto-${s.slug}">-</span>
      <span class="punto-color" style="background:${s.color}"></span>
      <span class="nombre">${s.nombre}</span>
      <span class="total" id="total-${s.slug}">0</span>
      <span class="delta" id="delta-${s.slug}">+0</span>
    </div>`).join("");
}

function alternarJugador(slug) {
  if (ocultos.has(slug)) ocultos.delete(slug); else ocultos.add(slug);
  const fila = document.getElementById(`fila-${slug}`);
  fila.style.opacity = ocultos.has(slug) ? "0.3" : "1";
  fila.style.filter = ocultos.has(slug) ? "grayscale(100%)" : "none";
  pintarGrafico(progresoActual);
}

function alternar() {
  if (corriendo) return parar();
  const barra = document.getElementById("barra");
  if (+barra.value >= CLAVES.length - 1) { barra.value = 0; pintar(0); }
  document.getElementById("btn-play").textContent = "⏸ Pausa";
  const velocidad = () => +document.getElementById("velocidad").value;
  const paso = () => {
    const siguiente = progresoActual + 1;
    if (siguiente > CLAVES.length - 1) return parar();
    barra.value = siguiente;
    pintar(siguiente);
    corriendo = setTimeout(paso, velocidad());
  };
  corriendo = setTimeout(paso, velocidad());
}

function parar() {
  clearTimeout(corriendo);
  corriendo = null;
  document.getElementById("btn-play").textContent = "▶ Reproducir";
}

function pintar(hasta) {
  progresoActual = hasta;
  document.getElementById("etiqueta").textContent = `Jornada ${parseInt(CLAVES[hasta].slice(1))}`;
  pintarGrafico(hasta);
  pintarMarcador(hasta);
}

function pintarGrafico(hasta) {
  const W = 900, H = 400, M = { t: 20, r: 70, b: 30, l: 45 };
  const visibles = SERIES.filter((s) => !ocultos.has(s.slug)).map((s) => ({ s, pts: s.puntos.slice(0, hasta + 1) }));
  const todos = visibles.flatMap((v) => v.pts.map((p) => p.acumulado));
  const maxY = Math.max(...todos, 1), minY = Math.min(...todos, 0);
  const rango = maxY - minY || 1;

  const x = (i) => M.l + (i * (W - M.l - M.r)) / Math.max(CLAVES.length - 1, 1);
  const y = (v) => H - M.b - ((v - minY) / rango) * (H - M.t - M.b);

  const fondoJornadas = CLAVES.map((k, i) => i % 2 === 0
    ? `<rect x="${x(i - 0.5).toFixed(1)}" y="${M.t}" width="${(x(i + 0.5) - x(i - 0.5)).toFixed(1)}"
             height="${H - M.t - M.b}" fill="rgba(255,255,255,0.02)"/>`
    : "").join("");

  const lineas = visibles.map(({ s, pts }) => {
    const d = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.acumulado).toFixed(1)}`).join(" ");
    const ultimo = pts[pts.length - 1];
    return `
      <path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(pts.length - 1).toFixed(1)}" cy="${y(ultimo.acumulado).toFixed(1)}" r="4.5" fill="${s.color}"/>
      <text x="${(x(pts.length - 1) + 8).toFixed(1)}" y="${(y(ultimo.acumulado) + 4).toFixed(1)}"
            fill="${s.color}" font-size="11" font-weight="bold">${s.nombre.slice(0, 8)} ${ultimo.acumulado}</text>`;
  }).join("");

  document.getElementById("grafico").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${fondoJornadas}
      <line x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}" stroke="#444"/>
      <line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}" stroke="#444"/>
      <text x="8" y="${y(maxY) + 4}" fill="#9ca3af" font-size="11">${maxY}</text>
      <text x="8" y="${y(minY) + 4}" fill="#9ca3af" font-size="11">${minY}</text>
      ${CLAVES.map((k, i) => CLAVES.length <= 20 || i % 3 === 0
        ? `<text x="${x(i).toFixed(1)}" y="${H - 10}" fill="#9ca3af" font-size="10" text-anchor="middle">${parseInt(k.slice(1))}</text>`
        : "").join("")}
      ${lineas}
    </svg>`;
}

function pintarMarcador(hasta) {
  const filas = SERIES.map((s) => ({
    slug: s.slug,
    total: s.puntos[hasta].acumulado,
    jornada: s.puntos[hasta].jornada,
    ganador: s.puntos[hasta].ganador,
    perdedor: s.puntos[hasta].perdedor,
  })).sort((a, b) => b.total - a.total);

  filas.forEach((f, rank) => {
    const fila = document.getElementById(`fila-${f.slug}`);
    fila.style.top = (rank * 48 + 4) + "px";
    document.getElementById(`puesto-${f.slug}`).textContent = rank + 1;
    document.getElementById(`total-${f.slug}`).textContent = f.total;

    const delta = document.getElementById(`delta-${f.slug}`);
    if (f.jornada === null) { delta.textContent = "—"; delta.style.color = "#666"; }
    else if (f.jornada === 0) { delta.textContent = "+0"; delta.style.color = "#666"; }
    else { delta.textContent = `+${f.jornada}`; delta.style.color = "#3b82f6"; }
    if (f.ganador) delta.style.color = "goldenrod";
    if (f.perdedor) delta.style.color = "#ff4c4c";
  });
}

iniciar();
</script>
</body>
</html>
